<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digicel Grenada - Free Event Wi-Fi</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --digicel-red: #E30613;
            --digicel-dark: #121212;
            --card-bg: rgba(255, 255, 255, 0.06);
            --border-light: rgba(255, 255, 255, 0.1);
            --text-main: #FFFFFF;
            --text-muted: #B3B3B3;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at top, #2c0205 0%, var(--digicel-dark) 70%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start; 
            min-height: 100vh;
            overflow-y: auto; 
        }

        .splash-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 35px 25px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            margin: 30px 20px; 
            box-sizing: border-box;
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .digicel-logo {
            font-size: 34px;
            font-weight: 800;
            color: var(--digicel-red);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin: 0;
        }

        .logo-subtext {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: -2px;
            font-weight: 600;
        }

        .event-badge {
            background-color: rgba(227, 6, 19, 0.15);
            color: #FF4D5A;
            border: 1px solid rgba(227, 6, 19, 0.3);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 22px;
            margin: 0 0 8px 0;
            font-weight: 700;
        }

        .welcome-text {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.4;
            margin: 0 0 25px 0;
        }

        /* Full Promo Image Layout */
        .promo-image-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(227, 6, 19, 0.4);
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .promo-header-tag {
            padding: 12px 15px 8px 15px;
        }

        .promo-tag {
            font-size: 9px;
            background: var(--digicel-red);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
            display: inline-block;
        }

        /* Container allowing full vertical height display */
        .image-full-wrapper {
            margin: 0 12px 12px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .image-full-wrapper img {
            width: 100%;
            display: block;
            height: auto;
        }

        .consent-box {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 25px;
            text-align: left;
        }

        .consent-text {
            font-size: 12px;
            color: #E0E0E0;
            line-height: 1.5;
            margin: 0;
        }

        /* Meraki Form Button Native Style Overrides */
        input[type="submit"] {
            background-color: var(--digicel-red) !important;
            color: #FFFFFF !important;
            border: none !important;
            padding: 16px !important;
            width: 100% !important;
            border-radius: 8px !important;
            font-size: 16px !important;
            font-weight: 700 !important;
            cursor: pointer !important;
            font-family: 'Montserrat', sans-serif !important;
            transition: all 0.2s ease !important;
            box-shadow: 0 4px 15px rgba(227, 6, 19, 0.35) !important;
            text-transform: uppercase !important;
            letter-spacing: 0.5px !important;
        }

        input[type="submit"]:disabled {
            background-color: #444444 !important;
            color: #888888 !important;
            cursor: not-allowed !important;
            box-shadow: none !important;
        }

        input[type="submit"]:not(:disabled):hover {
            background-color: #b8050f !important;
            box-shadow: 0 6px 18px rgba(227, 6, 19, 0.5) !important;
        }

        .footer {
            margin-top: 25px;
            font-size: 10px;
            color: #555;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="splash-container">
    
    <div class="logo-container">
        <h1 class="digicel-logo">Digicel</h1>
        <div class="logo-subtext">Grenada</div>
    </div>

    <div class="event-badge">✨ Free Event Wi-Fi</div>

    <h1>Welcome to the Network</h1>
    <p class="welcome-text">Get connected instantly courtesy of Digicel.</p>

    <div class="promo-image-box">
        <div class="promo-header-tag">
            <span class="promo-tag">Current Promotion</span>
        </div>
        <div class="image-full-wrapper">
            <img src="https://exelcovert.github.io/Digicel_Splash/GND%20WorldCup%2003-SOC-1080x1920.jpg" alt="Digicel Big Matches Bigger Bundle Promotion">
        </div>
    </div>

    <div class="consent-box">
        <p class="consent-text">
            By clicking the authorization control action step below, <strong>I agree</strong> to the default Digicel terms of use layout provisions.
        </p>
    </div>

    <form action="$MERAKI:FORM_ACTION$" method="post" id="portal-form">
        <input type="hidden" name="target" value="$MERAKI:TARGET$">
