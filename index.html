<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digicel Grenada - Free Event Wi-Fi</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --digicel-red: #E30613;
            --digicel-dark: #121212;
            --card-bg: rgba(255, 255, 255, 0.06);
            --border-light: rgba(255, 255, 255, 0.1);
            --text-main: #FFFFFF;
            --text-muted: #B3B3B3;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at top, #2c0205 0%, var(--digicel-dark) 70%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-y: auto; /* Force page level scrolling */
        }

        .splash-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 35px 25px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            margin: 30px 20px;
            box-sizing: border-box;
        }

        /* Brand Header */
        .logo-container {
            margin-bottom: 20px;
        }

        .digicel-logo {
            font-size: 34px;
            font-weight: 800;
            color: var(--digicel-red);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin: 0;
        }

        .logo-subtext {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: -2px;
            font-weight: 600;
        }

        .event-badge {
            background-color: rgba(227, 6, 19, 0.15);
            color: #FF4D5A;
            border: 1px solid rgba(227, 6, 19, 0.3);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 22px;
            margin: 0 0 8px 0;
            font-weight: 700;
        }

        .welcome-text {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.4;
            margin: 0 0 25px 0;
        }

        /* Full Promo Image Layout Style */
        .promo-image-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(227, 6, 19, 0.4);
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .promo-header-tag {
            padding: 12px 15px 8px 15px;
        }

        .promo-tag {
            font-size: 9px;
            background: var(--digicel-red);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
            display: inline-block;
        }

        .image-full-wrapper {
            margin: 0 12px 12px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .image-full-wrapper img {
            width: 100%;
            display: block;
            height: auto;
        }

        /* Terms & Checkbox */
        .terms-container {
            display: flex;
            align-items: flex-start;
            text-align: left;
            margin: 20px 0 25px 0;
        }

        .terms-container input[type="checkbox"] {
            margin-right: 10px;
            margin-top: 2px;
            cursor: pointer;
            accent-color: var(--digicel-red);
            width: 16px;
            height: 16px;
        }

        .terms-label {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.4;
            margin: 0;
            cursor: pointer;
            text-transform: none;
            letter-spacing: 0;
        }

        /* Action Button */
        .btn-connect {
            background-color: var(--digicel-red);
            color: #FFFFFF;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(227, 6, 19, 0.35);
        }

        .btn-connect:disabled {
            background-color: #444444;
            color: #888888;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-connect:not(:disabled):hover {
            background-color: #b8050f;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(227, 6, 19, 0.5);
        }

        .btn-connect:active:not(:disabled) {
            transform: translateY(1px);
        }

        .footer {
            margin-top: 25px;
            font-size: 10px;
            color: #555;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="splash-container">
    
    <div class="logo-container">
        <h1 class="digicel-logo">Digicel</h1>
        <div class="logo-subtext">Grenada</div>
    </div>

    <div class="event-badge">✨ Free Event Wi-Fi</div>

    <h1>Connect to High-Speed</h1>
    <p class="welcome-text">Accept our network terms below to activate your session, sponsored by Digicel.</p>

    <div class="promo-image-box">
        <div class="promo-header-tag">
            <span class="promo-tag">Current Promotion</span>
        </div>
        <div class="image-full-wrapper">
            <img src="https://exelcovert.github.io/Digicel_Splash/GND%20WorldCup%2003-SOC-1080x1920.jpg" alt="Digicel Big Matches Bigger Bundle Promotion">
        </div>
    </div>

    <form id="meraki-form" action="#" method="POST">
        <input type="hidden" name="base_grant_url" id="base_grant_url">
        <input type="hidden" name="user_continue_url" id="user_continue_url">
        <input type="hidden" name="node_mac" id="node_mac">
        <input type="hidden" name="client_mac" id="client_mac">

        <div class="terms-container">
            <input type="checkbox" id="terms" required>
            <label class="terms-label" for="terms">
                I agree to the Terms of Service and consent to receiving updates from Digicel Grenada regarding new plans and events.
            </label>
        </div>

        <button type="submit" id="submit-btn" class="btn-connect">Access Free Internet</button>
    </form>

    <div class="footer">
        Powered by Cisco Meraki
    </div>
</div>

<script>
    // Meraki URL Parameter Parser
    function getURLParameter(name) {
        return decodeURIComponent((new RegExp('[?|&]' + name + '=' + '([^&;]+?)(&|#|;|$)').exec(location.search) || [null, ''])[1].replace(/\+/g, '%20')) || null;
    }

    // Dynamic Parameter Binding 
    window.onload = function() {
        var base_grant_url = getURLParameter('base_grant_url');
        var user_continue_url = getURLParameter('user_continue_url');
        var node_mac = getURLParameter('node_mac');
        var client_mac = getURLParameter('client_mac');

        if(base_grant_url) document.getElementById('base_grant_url').value = base_grant_url;
        if(user_continue_url) document.getElementById('user_continue_url').value = user_continue_url;
        if(node_mac) document.getElementById('node_mac').value = node_mac;
        if(client_mac) document.getElementById('client_mac').value = client_mac;

        // Apply dynamic form action submission URL redirection hook
        if(base_grant_url) {
            document.getElementById('meraki-form').action = base_grant_url;
        } else {
            console.log("Local development environment simulation: Meraki AP variables omitted.");
        }

        // --- ENFORCE THE MULTI-SECOND PROMO DISPLAY TIMER ---
        var submitBtn = document.getElementById('submit-btn');
        if (submitBtn) {
            var secondsLeft = 5; 
            submitBtn.disabled = true;
            var defaultText = "Access Free Internet";
            submitBtn.value = defaultText + " (" + secondsLeft + "s)";
            submitBtn.innerText = defaultText + " (" + secondsLeft + "s)";

            var countdownInterval = setInterval(function() {
                secondsLeft--;
                if (secondsLeft > 0) {
                    submitBtn.value = defaultText + " (" + secondsLeft + "s)";
                    submitBtn.innerText = defaultText + " (" + secondsLeft + "s)";
                } else {
                    clearInterval(countdownInterval);
                    submitBtn.value = defaultText;
                    submitBtn.innerText = defaultText;
                    submitBtn.disabled = false; 
                }
            }, 1000);
        }
    };
</script>

</body>
</html>
